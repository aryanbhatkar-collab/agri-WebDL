<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Irrigation Advisory</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 20px auto; padding: 20px; }
        label, input, select, button { display: block; width: 100%; margin-bottom: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-box { background: white; padding: 20px; max-width: 300px; margin: 100px auto; text-align: center; }
    </style>
</head>
<body>

    <h2>Irrigation Advisory</h2>
    <form id="advisoryForm">
        <label>Farmer Name: <input type="text" id="fname" required></label>
        <label>Plot ID: <input type="text" id="plot_id" required></label>
        <label>Crop Stage: 
            <select id="crop_stage" required>
                <option value="Germination">Germination</option>
                <option value="Tillering">Tillering</option>
                <option value="Grand Growth">Grand Growth</option>
                <option value="Maturity">Maturity</option>
            </select>
        </label>
        <label>Soil Moisture (%): <input type="number" id="moisture" required></label>
        <label>Rain Expected: 
            <select id="rain" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </label>
        <button type="submit">Submit</button>
    </form>

    <div id="modal" class="modal">
        <div class="modal-box">
            <h3 id="alertMsg"></h3>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        let reportData = "";

        document.getElementById("advisoryForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            let name = document.getElementById("fname").value;
            let plot = document.getElementById("plot_id").value;
            let stage = document.getElementById("crop_stage").value;
            let moisture = parseFloat(document.getElementById("moisture").value);
            let rain = document.getElementById("rain").value;
            let rec = "";

            if (rain === "Yes") rec = "Postpone Irrigation";
            else if (moisture < 30) rec = "Irrigation Required Immediately";
            else if (moisture <= 50) rec = "Monitor Soil Moisture";
            else rec = "Irrigation Not Required";

            reportData = `
                <h2>Irrigation Decision Report</h2>
                <p><strong>Farmer Name:</strong> ${name}</p>
                <p><strong>Plot ID:</strong> ${plot}</p>
                <p><strong>Crop Stage:</strong> ${stage}</p>
                <p><strong>Soil Moisture:</strong> ${moisture}%</p>
                <p><strong>Rain Expected:</strong> ${rain}</p>
                <p><strong>Recommendation:</strong> ${rec}</p>
            `;

            document.getElementById("alertMsg").innerText = rec;
            document.getElementById("modal").style.display = "block";
        });

        function closeModal() {
            document.write(reportData);
        }
    </script>
</body>
</html>
