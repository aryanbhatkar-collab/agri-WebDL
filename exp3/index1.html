<!DOCTYPE html>
<html>
  <head>
    <title>Simple Change</title>
  </head>
<body>

<h1 id="demo">Original Text</h1>
<button onclick="changeText()">Change Text</button>

<script>
function changeText() {
  // Select element and modify content
  document.getElementById("demo").textContent = "Text Changed!";
}
</script>

</body>
</html>
