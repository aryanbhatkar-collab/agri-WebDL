<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farm Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Farm Gallery</h1>
    </header>

    <main>
        <div class="gallery">
            <figure>
                <a href="https://via.placeholder.com/600" target="_blank">
                    <img src="https://via.placeholder.com/200" alt="Healthy Sugarcane Crop" title="Healthy Sugarcane Crop" width="200" height="150">
                </a>
                <figcaption>Healthy Sugarcane Crop</figcaption>
            </figure>

            <figure>
                <a href="https://via.placeholder.com/600" target="_blank">
                    <img src="https://via.placeholder.com/200" alt="Drip Irrigation System" title="Drip Irrigation System" width="200" height="150">
                </a>
                <figcaption>Drip Irrigation System</figcaption>
            </figure>

            <figure>
                <a href="https://via.placeholder.com/600" target="_blank">
                    <img src="https://via.placeholder.com/200" alt="Soil Moisture Sensor" title="Soil Moisture Sensor" width="200" height="150">
                </a>
                <figcaption>Soil Moisture Sensor</figcaption>
            </figure>

            <figure>
                <a href="https://via.placeholder.com/600" target="_blank">
                    <img src="https://via.placeholder.com/200" alt="Weather Monitoring Station" title="Weather Monitoring Station" width="200" height="150">
                </a>
                <figcaption>Weather Station</figcaption>
            </figure>
        </div>
    </main>

</body>
</html>
